name: Simulation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test engine-free simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Building runs the banned-API analyzer on the simulation and harness; a violation fails here.
      - name: Run simulation tests
        run: >
          dotnet test tests/Eleven.Simulation.Tests/Eleven.Simulation.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      # A green run with zero discovered tests would look like success; fail it instead.
      - name: Check that tests ran
        run: |
          counters=$(grep -o '<Counters [^>]*>' TestResults/results.trx)
          total=$(echo "$counters" | grep -o 'total="[0-9]*"' | grep -o '[0-9]\+')
          passed=$(echo "$counters" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]\+')
          echo "::notice title=Simulation tests::${passed:-0} of ${total:-0} passed"
          test "${total:-0}" -gt 0

      - name: Build headless harness
        run: dotnet build src/Eleven.Simulation.Cli/Eleven.Simulation.Cli.csproj --configuration Release

      - name: Write per-tick hash logs
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll hashlog hashlogs | tee hashlog-summary.txt
          echo "::notice title=Hash log digests::$(paste -sd ';' hashlog-summary.txt | sed 's| -> [^;]*||g')"

      - name: Publish hash logs
        uses: actions/upload-artifact@v4
        with:
          name: hashlogs
          path: hashlogs/
          if-no-files-found: error

      # Evidence only: there is no pass/fail budget for tick cost.
      - name: Measure tick cost
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll bench 30 | tee bench.txt
          echo "::notice title=Tick cost::$(paste -sd ';' bench.txt)"
