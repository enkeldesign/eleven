name: Simulation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test engine-free simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Building runs the banned-API analyzer on the simulation and harness; a violation fails here.
      - name: Run simulation tests
        run: >
          dotnet test tests/Eleven.Simulation.Tests/Eleven.Simulation.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      # A green run with zero discovered tests would look like success; fail it instead.
      - name: Check that tests ran
        run: |
          counters=$(grep -o '<Counters [^>]*>' TestResults/results.trx)
          total=$(echo "$counters" | grep -o 'total="[0-9]*"' | grep -o '[0-9]\+')
          passed=$(echo "$counters" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]\+')
          echo "::notice title=Simulation tests::${passed:-0} of ${total:-0} passed"
          test "${total:-0}" -gt 0

      # The visual system's tokens (#48): palette, mappings, contrast and scales.
      - name: Run presentation tests
        run: >
          dotnet test tests/Eleven.Presentation.Tests/Eleven.Presentation.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=presentation.trx"
          --results-directory TestResults

      - name: Check that presentation tests ran
        run: |
          counters=$(grep -o '<Counters [^>]*>' TestResults/presentation.trx)
          total=$(echo "$counters" | grep -o 'total="[0-9]*"' | grep -o '[0-9]\+')
          passed=$(echo "$counters" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]\+')
          echo "::notice title=Presentation tests::${passed:-0} of ${total:-0} passed"
          test "${total:-0}" -gt 0

      # The host's engine-free pieces, compiled from unity/Assets (#55).
      - name: Run host tests
        run: >
          dotnet test tests/Eleven.Host.Tests/Eleven.Host.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=host.trx"
          --results-directory TestResults

      - name: Check that host tests ran
        run: |
          counters=$(grep -o '<Counters [^>]*>' TestResults/host.trx)
          total=$(echo "$counters" | grep -o 'total="[0-9]*"' | grep -o '[0-9]\+')
          passed=$(echo "$counters" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]\+')
          echo "::notice title=Host tests::${passed:-0} of ${total:-0} passed"
          test "${total:-0}" -gt 0

      - name: Build headless harness
        run: dotnet build src/Eleven.Simulation.Cli/Eleven.Simulation.Cli.csproj --configuration Release

      - name: Write per-tick hash logs
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll hashlog hashlogs | tee hashlog-summary.txt
          echo "::notice title=Hash log digests::$(paste -sd ';' hashlog-summary.txt | sed 's| -> [^;]*||g')"

      - name: Publish hash logs
        uses: actions/upload-artifact@v4
        with:
          name: hashlogs
          path: hashlogs/
          if-no-files-found: error

      # Technical reference curves of the current ball values, not approved feel (#24).
      - name: Characterise the ball
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll curves ball-curves | tee curves.txt
          echo "::notice title=Ball curves::$(sed 's| -> .*||' curves.txt)"

      - name: Publish ball curves
        uses: actions/upload-artifact@v4
        with:
          name: ball-curves
          path: ball-curves/
          if-no-files-found: error

      # Technical reference movement of the reference profile and the starting-range grid (#36).
      - name: Characterise movement
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll movement movement-curves | tee movement.txt
          echo "::notice title=Movement curves::$(sed 's| -> .*||' movement.txt)"

      - name: Publish movement curves
        uses: actions/upload-artifact@v4
        with:
          name: movement-curves
          path: movement-curves/
          if-no-files-found: error

      # Technical reference kicks: launches across strength and loft, aftertouch across its starting window (#37).
      - name: Characterise kicks
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll kicks kick-curves | tee kicks.txt
          echo "::notice title=Kick curves::$(sed 's| -> .*||' kicks.txt)"

      - name: Publish kick curves
        uses: actions/upload-artifact@v4
        with:
          name: kick-curves
          path: kick-curves/
          if-no-files-found: error

      # Technical reference quick passes: the practice drills under contrasting passer profiles (#38).
      - name: Measure quick passes
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll passes pass-curves | tee passes.txt
          echo "::notice title=Pass curves::$(sed 's| -> .*||' passes.txt)"

      - name: Publish pass curves
        uses: actions/upload-artifact@v4
        with:
          name: pass-curves
          path: pass-curves/
          if-no-files-found: error

      # Evidence only: there is no pass/fail budget for tick cost.
      - name: Measure tick cost
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll bench 30 | tee bench.txt
          echo "::notice title=Tick cost::$(paste -sd ';' bench.txt)"
