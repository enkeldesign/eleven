name: Simulation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test engine-free simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Building runs the banned-API analyzer on the simulation and harness; a violation fails here.
      - name: Run simulation tests
        run: >
          dotnet test tests/Eleven.Simulation.Tests/Eleven.Simulation.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      # A green run with zero discovered tests would look like success; fail it instead.
      - name: Check that tests ran
        run: |
          counters=$(grep -o '<Counters [^>]*>' TestResults/results.trx)
          total=$(echo "$counters" | grep -o 'total="[0-9]*"' | grep -o '[0-9]\+')
          passed=$(echo "$counters" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]\+')
          echo "::notice title=Simulation tests::${passed:-0} of ${total:-0} passed"
          test "${total:-0}" -gt 0

      # The visual system's tokens (#48): palette, mappings, contrast and scales.
      - name: Run presentation tests
        run: >
          dotnet test tests/Eleven.Presentation.Tests/Eleven.Presentation.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=presentation.trx"
          --results-directory TestResults

      - name: Check that presentation tests ran
        run: |
          counters=$(grep -o '<Counters [^>]*>' TestResults/presentation.trx)
          total=$(echo "$counters" | grep -o 'total="[0-9]*"' | grep -o '[0-9]\+')
          passed=$(echo "$counters" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]\+')
          echo "::notice title=Presentation tests::${passed:-0} of ${total:-0} passed"
          test "${total:-0}" -gt 0

      # The host's engine-free pieces, compiled from unity/Assets (#55).
      - name: Run host tests
        run: >
          dotnet test tests/Eleven.Host.Tests/Eleven.Host.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=host.trx"
          --results-directory TestResults

      - name: Check that host tests ran
        run: |
          counters=$(grep -o '<Counters [^>]*>' TestResults/host.trx)
          total=$(echo "$counters" | grep -o 'total="[0-9]*"' | grep -o '[0-9]\+')
          passed=$(echo "$counters" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]\+')
          echo "::notice title=Host tests::${passed:-0} of ${total:-0} passed"
          test "${total:-0}" -gt 0

      - name: Build headless harness
        run: dotnet build src/Eleven.Simulation.Cli/Eleven.Simulation.Cli.csproj --configuration Release

      - name: Write per-tick hash logs
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll hashlog hashlogs | tee hashlog-summary.txt
          echo "::notice title=Hash log digests::$(paste -sd ';' hashlog-summary.txt | sed 's| -> [^;]*||g')"

      - name: Publish hash logs
        uses: actions/upload-artifact@v4
        with:
          name: hashlogs
          path: hashlogs/
          if-no-files-found: error

      # Technical reference curves of the current ball values, not approved feel (#24).
      - name: Characterise the ball
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll curves ball-curves | tee curves.txt
          echo "::notice title=Ball curves::$(sed 's| -> .*||' curves.txt)"

      - name: Publish ball curves
        uses: actions/upload-artifact@v4
        with:
          name: ball-curves
          path: ball-curves/
          if-no-files-found: error

      # Technical reference movement of the reference profile and the starting-range grid (#36).
      - name: Characterise movement
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll movement movement-curves | tee movement.txt
          echo "::notice title=Movement curves::$(sed 's| -> .*||' movement.txt)"

      - name: Publish movement curves
        uses: actions/upload-artifact@v4
        with:
          name: movement-curves
          path: movement-curves/
          if-no-files-found: error

      # Technical reference kicks: launches across strength and loft, aftertouch across its starting window (#37).
      - name: Characterise kicks
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll kicks kick-curves | tee kicks.txt
          echo "::notice title=Kick curves::$(sed 's| -> .*||' kicks.txt)"

      - name: Publish kick curves
        uses: actions/upload-artifact@v4
        with:
          name: kick-curves
          path: kick-curves/
          if-no-files-found: error

      # Technical reference quick passes: the practice drills under contrasting passer profiles (#38).
      - name: Measure quick passes
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll passes pass-curves | tee passes.txt
          echo "::notice title=Pass curves::$(sed 's| -> .*||' passes.txt)"

      - name: Publish pass curves
        uses: actions/upload-artifact@v4
        with:
          name: pass-curves
          path: pass-curves/
          if-no-files-found: error

      # Technical reference dribbling: the FREE model's cases under two ball-control profiles (#59).
      - name: Characterise dribbling
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll dribble dribble-curves | tee dribble.txt
          echo "::notice title=Dribble curves::$(sed 's| -> .*||' dribble.txt)"

      - name: Publish dribble curves
        uses: actions/upload-artifact@v4
        with:
          name: dribble-curves
          path: dribble-curves/
          if-no-files-found: error

      # Technical reference goal edges: shots at the posts and the crossbar, inside to wide (#68).
      - name: Characterise the goal
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll goal goal-edges | tee goal.txt
          echo "::notice title=Goal edges::$(sed 's| -> .*||' goal.txt)"

      - name: Publish goal edges
        uses: actions/upload-artifact@v4
        with:
          name: goal-edges
          path: goal-edges/
          if-no-files-found: error

      # Technical reference keeper: shots from 11 and 16 m against a reference and a slow keeper (#69).
      - name: Characterise the keeper
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll keeper keeper-shots | tee keeper.txt
          echo "::notice title=Keeper shots::$(sed 's| -> .*||' keeper.txt)"

      - name: Publish keeper shots
        uses: actions/upload-artifact@v4
        with:
          name: keeper-shots
          path: keeper-shots/
          if-no-files-found: error

      # Technical reference turns with the ball: 90°, 135° and 180°, off and on, from every touch phase (#66).
      - name: Characterise turns
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll turns turn-curves | tee turns.txt
          echo "::notice title=Turn curves::$(sed 's| -> .*||' turns.txt)"

      - name: Publish turn curves
        uses: actions/upload-artifact@v4
        with:
          name: turn-curves
          path: turn-curves/
          if-no-files-found: error

      # Push-and-chase beside FREE's short touches, an experiment (#63).
      - name: Characterise push-and-chase
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll push push-curves | tee push.txt
          echo "::notice title=Push curves::$(sed 's| -> .*||' push.txt)"

      - name: Publish push curves
        uses: actions/upload-artifact@v4
        with:
          name: push-curves
          path: push-curves/
          if-no-files-found: error

      # Headers and volleys (#94): contact by height, incoming speed and heading, and in CPU matches.
      - name: Characterise headers and volleys
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll air air-curves | tee air.txt
          echo "::notice title=Air contact::$(sed 's| -> .*||' air.txt)"

      - name: Publish air curves
        uses: actions/upload-artifact@v4
        with:
          name: air-curves
          path: air-curves/
          if-no-files-found: error

      # The standing challenge (#84): approach angles, dribbler speeds, tackling.
      - name: Characterise the standing challenge
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll challenge challenge-bench | tee challenge.txt
          echo "::notice title=Challenge bench::$(sed 's| -> .*||' challenge.txt)"

      - name: Publish the challenge bench
        uses: actions/upload-artifact@v4
        with:
          name: challenge-bench
          path: challenge-bench/
          if-no-files-found: error

      # 2v2 CPU-against-CPU matches: passes, possessions, spacing and bunching (#92).
      - name: Play the 2v2 trials
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll squads squad-trials 2 | tee squads.txt
          echo "::notice title=2v2 trials::$(sed 's| -> .*||' squads.txt)"

      - name: Publish the 2v2 trials
        uses: actions/upload-artifact@v4
        with:
          name: squad-trials
          path: squad-trials/
          if-no-files-found: error

      # Five a side (#96): the shape, the press and the dribble's cost, against the recorded reference.
      - name: Play the 5v5 trials
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll squads squad-5v5 5 | tee squads5.txt
          echo "::notice title=5v5 trials::$(sed 's| -> .*||' squads5.txt)"
          diff docs/simulation/squad-5v5-reference.csv squad-5v5/squad-5v5-trials.csv

      # M3's gate (#103): a double round robin of six sides at five a side, against the recorded
      # reference. The command fails on a stuck match or no spread by tier.
      - name: Play the 5v5 league
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll league league | tee league.txt
          echo "::notice title=5v5 league::$(sed 's| -> .*||' league.txt)"
          diff docs/simulation/league-reference.csv league/league-matches.csv

      - name: Publish the 5v5 league
        uses: actions/upload-artifact@v4
        with:
          name: league
          path: league/
          if-no-files-found: error

      # Off-screen threat fairness (#102): how often the CPU decides on footballers outside the
      # human's view, by tier, against the recorded reference. Fails past the recorded bounds.
      - name: Measure off-screen fairness
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll fairness fairness | tee fairness.txt
          echo "::notice title=Off-screen fairness::$(sed 's| -> .*||' fairness.txt)"
          diff docs/simulation/fairness-reference.csv fairness/fairness.csv

      # Eleven a side (#106): ten outfielders and a keeper a side in a 4-4-2, against the recorded reference.
      - name: Play the 11v11 trials
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll squads squad-11v11 10 | tee squads11.txt
          echo "::notice title=11v11 trials::$(sed 's| -> .*||' squads11.txt)"
          diff docs/simulation/squad-10v10-reference.csv squad-11v11/squad-10v10-trials.csv

      # The tick budget (#106): 11v11 at 60 and 120 Hz, each step timed. Fails if a 60 Hz step
      # averages over a quarter of its frame. The runner's timing: published, not diffed.
      - name: Measure the tick budget
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll budget budget 3 | tee budget.txt
          echo "::notice title=Tick budget::$(sed 's| -> .*||' budget.txt)"

      - name: Publish the tick budget
        uses: actions/upload-artifact@v4
        with:
          name: budget
          path: budget/
          if-no-files-found: error

      # M4's gate (#112): a round robin and a knockout cup at eleven a side, with every law of M4
      # and each cup tie replayed from its recording. Fails if a match is stuck, a replay differs
      # or the cup has no winner, and its matches are diffed against the reference.
      - name: Play the 11v11 gate
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll gate11 gate11 | tee gate11.txt
          echo "::notice title=11v11 gate::$(sed 's| -> .*||' gate11.txt)"
          diff docs/simulation/gate11-reference.csv gate11/gate11-matches.csv

      - name: Publish the 11v11 gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate11
          path: gate11/
          if-no-files-found: warn

      # M2's gate (#95): fifty 2v2 matches CPU against CPU, and fifty with a human seat that switches.
      - name: Evaluate 2v2 over fifty matches
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll squads squad-evaluation 2 50 | tee squad-eval.txt
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll squads squad-evaluation 2 50 seat | tee -a squad-eval.txt
          echo "::notice title=2v2 evaluation::$(sed 's| -> .*||' squad-eval.txt | tr '\n' ' ')"

      - name: Publish the 2v2 evaluation
        uses: actions/upload-artifact@v4
        with:
          name: squad-evaluation
          path: squad-evaluation/
          if-no-files-found: error

      # Whole CPU-against-CPU matches: scores, goals by half, length, stuck matches (#86), fifty of
      # them for M1's gate (#87).
      - name: Play the match trials
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll matches match-trials 50 | tee matches.txt
          echo "::notice title=Match trials::$(sed 's| -> .*||' matches.txt)"

      - name: Publish the match trials
        uses: actions/upload-artifact@v4
        with:
          name: match-trials
          path: match-trials/
          if-no-files-found: error

      # CPU-against-CPU matches with the referee on: restarts, dead-ball time, stalls (#85).
      - name: Run the restart trials
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll restarts restart-trials | tee restarts.txt
          echo "::notice title=Restart trials::$(sed 's| -> .*||' restarts.txt)"

      - name: Publish the restart trials
        uses: actions/upload-artifact@v4
        with:
          name: restart-trials
          path: restart-trials/
          if-no-files-found: error

      # CPU against CPU in the 1v1 world, every difficulty tier (#83), and the two ends compared (#82).
      - name: Run the CPU trials
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll cpu cpu-trials | tee cpu.txt
          echo "::notice title=CPU trials::$(sed 's| -> .*||' cpu.txt)"
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll sides | tee sides.txt
          echo "::notice title=Two ends::$(tr '\n' ' ' < sides.txt)"

      - name: Publish CPU trials
        uses: actions/upload-artifact@v4
        with:
          name: cpu-trials
          path: cpu-trials/
          if-no-files-found: error

      # Evidence only: there is no pass/fail budget for tick cost.
      - name: Measure tick cost
        run: |
          dotnet artifacts/bin/Eleven.Simulation.Cli/release/Eleven.Simulation.Cli.dll bench 30 | tee bench.txt
          echo "::notice title=Tick cost::$(paste -sd ';' bench.txt)"
