name: Unity host

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Web player
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The Unity WebGL editor image is about 7 GB compressed.
      - name: Free disk space for the Unity image
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: unity-library-${{ hashFiles('unity/Packages/manifest.json', 'unity/ProjectSettings/ProjectVersion.txt') }}-${{ hashFiles('unity/Assets/**', 'src/Eleven.Simulation/**', 'src/Eleven.Simulation.Harness/**') }}
          restore-keys: |
            unity-library-${{ hashFiles('unity/Packages/manifest.json', 'unity/ProjectSettings/ProjectVersion.txt') }}-

      - name: Start the clock
        run: echo "UNITY_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # -ignorecompilererrors lets the build script run and report compile errors itself:
      # job logs aren't readable from agent sessions, annotations are.
      - name: Build with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: WebGL
          buildMethod: Eleven.Host.Editor.BuildScript.BuildWeb
          versioning: None
          customParameters: >-
            -ignorecompilererrors
            -elevenBuildNumber ${{ github.run_number }}
            -elevenCommit ${{ github.event.pull_request.head.sha || github.sha }}
            -elevenReport /github/workspace/unity-build-report.txt

      - name: Report the build
        if: always()
        run: |
          escape() { sed -e 's/%/%25/g' | tr -d '\r'; }
          seconds=$(( $(date +%s) - UNITY_STARTED ))
          if [ ! -f unity-build-report.txt ]; then
            echo "::error title=Unity build::No build report: Unity stopped before the build script ran (licence activation, package resolution or editor compilation). GameCI step took ${seconds} s."
            exit 0
          fi
          grep '^error: ' unity-build-report.txt | head -10 | while IFS= read -r line; do
            echo "::error title=Unity::$(printf '%s' "${line#error: }" | cut -c1-2000 | escape)"
          done
          summary=$(grep -v '^error: ' unity-build-report.txt | paste -sd ';' | escape)
          player=$(dirname "$(find build unity/build -name index.html 2>/dev/null | head -1)")
          if [ -d "$player" ]; then
            bytes=$(du -sb "$player" | cut -f1)
            files=$(find "$player" -type f -printf '%f=%s ' | escape)
            echo "::notice title=Unity build::${summary}; GameCI step ${seconds} s; player ${bytes} bytes on disk: ${files}"
          else
            echo "::error title=Unity build::${summary}; GameCI step ${seconds} s; no index.html under build/ or unity/build/"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: web-player
          path: |
            build/WebGL
            unity/build/WebGL
          if-no-files-found: error

  smoke:
    name: Smoke test in Chromium
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-player
          path: web-player

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Write the .NET hash logs to compare against
        run: dotnet run --project src/Eleven.Simulation.Cli --configuration Release -- hashlog dotnet-hashlogs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        working-directory: unity/ci
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Run the smoke test
        run: |
          player=$(dirname "$(find web-player -name index.html | head -1)")
          node unity/ci/smoke.mjs "$player" dotnet-hashlogs smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/

  # Publishes the player to GitHub Pages: main at the site root, each PR under pr/<number>/.
  # Pages serves one artifact per deployment, so the whole site lives on the orphan branch
  # `site` (one commit, force-pushed) and every deploy uploads all of it. Previews of closed
  # PRs are pruned on each deploy.
  deploy:
    name: Deploy playable link
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.link.outputs.url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-player
          path: web-player

      - name: Assemble the site
        id: site
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch site "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site \
            || { git init --quiet site; git -C site checkout --quiet --orphan site; }
          rm -rf site/.git/shallow
          player=$(dirname "$(find web-player -name index.html | head -1)")

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            target="pr/${{ github.event.pull_request.number }}"
          else
            target="."
          fi

          if [ "$target" = "." ]; then
            # Replace the root build, keeping the previews.
            find site -mindepth 1 -maxdepth 1 ! -name .git ! -name pr -exec rm -rf {} +
          else
            rm -rf "site/$target"
          fi
          mkdir -p "site/$target"
          cp -R "$player"/. "site/$target/"
          touch site/.nojekyll

          # Prune previews of PRs that are no longer open.
          open=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[].number')
          for dir in site/pr/*/; do
            [ -d "$dir" ] || continue
            n=$(basename "$dir")
            echo "$open" | grep -qx "$n" || rm -rf "$dir"
          done

          echo "path=$target" >> "$GITHUB_OUTPUT"
          echo "bytes=$(du -sb "$player" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Store the site on the site branch
        run: |
          set -euo pipefail
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --quiet --orphan next
          git add -A
          git commit --quiet -m "Site for ${GITHUB_SHA::7} (${{ github.event_name }})"
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" next:site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: Check the link and measure push to link
        id: link
        run: |
          set -euo pipefail
          base="${{ steps.pages.outputs.page_url }}"
          path="${{ steps.site.outputs.path }}"
          url="${base%/}/"; [ "$path" = "." ] || url="${url}${path}/"
          echo "url=$url" >> "$GITHUB_OUTPUT"

          # Pages can take a moment to serve a new deployment.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${url}index.html" || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          # Push time: when the PR's head was last updated, or when main was pushed. A re-run
          # still counts from the push, since that is what someone waiting for the link sees.
          pushed='${{ github.event.pull_request.updated_at || github.event.repository.pushed_at }}'
          case "$pushed" in *[!0-9]*) pushed=$(date -d "$pushed" +%s) ;; esac
          seconds=$(( $(date +%s) - pushed ))
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          # Only a link that works is a push-to-link sample; loop-metrics.sh reads these notices.
          if [ "$code" != "200" ]; then
            echo "::error title=Playable link::${url} still returns HTTP ${code} ${seconds} s after the push"
            exit 1
          fi
          echo "::notice title=Playable link::${url} (HTTP ${code}); push to link ${seconds} s; player ${{ steps.site.outputs.bytes }} bytes"

      - name: Post the link on the PR
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          marker='<!-- eleven-playable-link -->'
          head='${{ github.event.pull_request.head.sha }}'
          minutes=$(awk "BEGIN { printf \"%.1f\", ${{ steps.link.outputs.seconds }} / 60 }")
          body="${marker}
          **Playable link:** ${{ steps.link.outputs.url }}

          Build ${{ github.run_number }}+${head::7} · push to link ${minutes} min · $(( ${{ steps.site.outputs.bytes }} / 1024 )) KiB

          _Updated by the Unity host workflow on every push._"
          body=$(printf '%s\n' "$body" | sed 's/^          //')
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments?per_page=100" \
            --jq "[.[] | select(.body | startswith(\"${marker}\"))][0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="$body" > /dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" -f body="$body" > /dev/null
          fi
